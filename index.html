<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>قرية السنافر</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #2c3e50;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        #hud {
            background: rgba(0,0,0,0.6);
            padding: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            border-bottom: 2px solid #3498db;
        }
        #game-container {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1000') center/cover;
        }
        #smurf {
            position: absolute;
            font-size: 40px;
            transition: all 0.2s ease;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        #controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            display: grid;
            grid-template-columns: repeat(3, 50px);
            gap: 5px;
            opacity: 0.8;
        }
        .btn {
            background: #3498db;
            border: none;
            color: white;
            font-size: 24px;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px #2980b9;
        }
        .btn:active {
            box-shadow: 0 2px #2980b9;
            transform: translateY(2px);
        }
    </style>
</head>
<body>

    <div id="hud">
        <span>🪙 <span id="coins">100</span></span>
        <span>💎 <span id="gems">5</span></span>
        <span>⚡ <span id="energy">100</span></span>
    </div>

    <div id="game-container">
        <div id="smurf">🧢</div>
        
        <div id="controls">
            <div></div>
            <button class="btn" onclick="move('up')">⬆️</button>
            <div></div>
            <button class="btn" onclick="move('left')">⬅️</button>
            <button class="btn" onclick="move('down')">⬇️</button>
            <button class="btn" onclick="move('right')">➡️</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#2c3e50');
        tg.setBackgroundColor('#2c3e50');

        let player = {
            x: 50, y: 50,
            coins: 100,
            gems: 5,
            energy: 100
        };

        function updateUI() {
            document.getElementById('coins').innerText = player.coins;
            document.getElementById('gems').innerText = player.gems;
            document.getElementById('energy').innerText = player.energy;
            const smurf = document.getElementById('smurf');
            smurf.style.top = player.y + '%';
            smurf.style.left = player.x + '%';
        }

        function move(direction) {
            const step = 5;
            if (direction === 'up' && player.y > 10) player.y -= step;
            if (direction === 'down' && player.y < 90) player.y += step;
            if (direction === 'left' && player.x > 10) player.x -= step;
            if (direction === 'right' && player.x < 90) player.x += step;
            updateUI();
            tg.sendData(JSON.stringify({ action: 'move', x: player.x, y: player.y }));
        }

        document.getElementById('game-container').addEventListener('click', function(e) {
            if (e.target.id === 'game-container') {
                player.coins += 10;
                player.energy -= 5;
                updateUI();
            }
        });

        updateUI();
    </script>
</body>
            </html>
